buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.testcontainers:postgresql:1.21.4'
        classpath 'org.flywaydb:flyway-core:11.8.2'
        classpath 'org.flywaydb:flyway-database-postgresql:11.8.2'
        classpath 'org.postgresql:postgresql:42.7.10'
        classpath 'org.jooq:jooq-codegen:3.19.31'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

jacoco {
    toolVersion = "0.8.10"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/jooq/**'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/jooq/**'
            ])
        }))
    }

    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

test {
    finalizedBy jacocoTestReport
}

group = 'com.codeit.team4'
version = '0.0.1-SNAPSHOT'
description = 'deokhugam'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            srcDir 'build/generated-src/jooq'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.redisson:redisson-spring-boot-starter:3.50.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.2'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation platform('software.amazon.awssdk:bom:2.42.38')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:cloudwatch'
    implementation 'io.micrometer:micrometer-registry-cloudwatch2'
}


tasks.register('generateJooq') {
    description = 'Testcontainers로 PostgreSQL을 띄우고 Flyway 마이그레이션 후 jOOQ 코드를 생성합니다.'
    group = 'jooq'

    inputs.files(fileTree('src/main/resources/db/migration'))
    outputs.dir('build/generated-src/jooq')

    doLast {
        def container = new org.testcontainers.containers.PostgreSQLContainer<>('postgres:17')
        container.start()

        try {
            org.flywaydb.core.Flyway.configure()
                    .dataSource(container.getJdbcUrl(), container.getUsername(), container.getPassword())
                    .locations('filesystem:src/main/resources/db/migration')
                    .load()
                    .migrate()

            def config = new org.jooq.meta.jaxb.Configuration()
                    .withJdbc(new org.jooq.meta.jaxb.Jdbc()
                            .withDriver('org.postgresql.Driver')
                            .withUrl(container.getJdbcUrl())
                            .withUser(container.getUsername())
                            .withPassword(container.getPassword()))
                    .withGenerator(new org.jooq.meta.jaxb.Generator()
                            .withDatabase(new org.jooq.meta.jaxb.Database()
                                    .withName('org.jooq.meta.postgres.PostgresDatabase')
                                    .withInputSchema('public')
                                    .withExcludes('flyway_schema_history|pgp_.*|armor|dearmor|crypt|gen_salt|digest|hmac|encrypt.*|decrypt.*|gen_random_bytes|gen_random_uuid'))
                            .withGenerate(new org.jooq.meta.jaxb.Generate()
                                    .withDaos(false)
                                    .withRecords(true)
                                    .withFluentSetters(true))
                            .withTarget(new org.jooq.meta.jaxb.Target()
                                    .withPackageName('com.codeit.team4.deokhugam.jooq')
                                    .withDirectory("${project.projectDir}/build/generated-src/jooq")))

            org.jooq.codegen.GenerationTool.generate(config)
        } finally {
            container.stop()
        }
    }
}

if (project.hasProperty('generateJooq')) {
    tasks.named('compileJava') {
        dependsOn 'generateJooq'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

name: CI

on:
  pull_request:
    branches:
      - dev


jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시 (선택)
        uses: gradle/actions/setup-gradle@v3

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 테스트 실행
        run: ./gradlew test

      - name: 테스트 커버리지 체크 (80% 이상)
        run: ./gradlew jacocoTestCoverageVerification
        continue-on-error: true  # 실패해도 CI 통과
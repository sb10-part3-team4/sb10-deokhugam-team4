spring:
  test:
    database:
      replace: none
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

dashboard:
  batch:
    cron: "-"
    zone: "Asia/Seoul"

notification:
  batch:
    cron: "-"
    zone: "Asia/Seoul"

log:
  backup:
    cron: "0 0 2 * * *"
    zone: "Asia/Seoul"
    dir: "/app/logs"
    s3-dir: "logs"
spring:
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  test:
    database:
      replace: none
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

dashboard:
  batch:
    cron: "-"
    zone: "Asia/Seoul"

notification:
  batch:
    cron: "-"
    zone: "Asia/Seoul"

log:
  backup:
    cron: "-"
    zone: "Asia/Seoul"
    dir: "logs"
    s3-dir: "logs"
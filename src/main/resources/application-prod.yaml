spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: WARN
    com.codeit.team4: INFO

user:
  cleanup:
    cron: "0 0 4 * * *"
    zone: "Asia/Seoul"

dashboard:
  batch:
    cron: "0 0 3 * * *"
    zone: "Asia/Seoul"

notification:
  batch:
    cron: "0 0 2 * * *"
    zone: "Asia/Seoul"
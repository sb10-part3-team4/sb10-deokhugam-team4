spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  cloudwatch:
    metrics:
      export:
        namespace: deokhugam
        enabled: true
        step: 1m
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

logging:
  level:
    root: WARN
    com.codeit.team4: INFO
    io.micrometer: WARN
    software.amazon.awssdk: WARN

user:
  cleanup:
    cron: "0 0 4 * * *"
    zone: "Asia/Seoul"

dashboard:
  batch:
    cron: "0 0 3 * * *"
    zone: "Asia/Seoul"

notification:
  batch:
    cron: "0 0 2 * * *"
    zone: "Asia/Seoul"

log:
  backup:
    cron: "0 0 2 * * *"
    zone: "Asia/Seoul"
    dir: "logs"
    s3-dir: "logs"

naver:
  api:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    book-search-url: https://openapi.naver.com/v1/search/book_adv.json

ocr:
  api:
    key: ${OCR_API_KEY}
    url: https://api.ocr.space/parse/image

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

